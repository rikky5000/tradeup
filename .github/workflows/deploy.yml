name: Uppdatera priser och publicera

on:
  schedule:
    - cron: "23 */6 * * *"   # var 6:e timme
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testa räknemotorn
        run: node --test tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hämta skindata och tradeit-priser
        # Vid kodändringar (push) återanvänds publicerade priser om collections
        # är oförändrade. Schemat och manuella körningar hämtar alltid nya.
        env:
          EVENT: ${{ github.event_name }}
          PUBLISHED: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json
        run: |
          args=(--out site/data.json)
          [ "$EVENT" = "push" ] && args+=(--reuse "$PUBLISHED")
          python scripts/fetch_data.py "${args[@]}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
